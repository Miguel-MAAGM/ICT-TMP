<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>{% block title %}Mi Web con Flask{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
      body { overflow-x: hidden; margin: 0; }
      #sidebar { width: 280px; transition: width 0.3s; }
      #sidebar.collapsed { width: 80px; }
      #sidebar .nav-link span,
      #sidebar .fs-4,
      #sidebar .dropdown-toggle strong {
        transition: opacity 0.3s;
      }
      #sidebar.collapsed .nav-link span,
      #sidebar.collapsed .fs-4,
      #sidebar.collapsed .dropdown-toggle strong {
        display: none;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div class="d-flex">
      <div id="sidebar" class="d-flex flex-column flex-shrink-0 p-3 text-bg-dark" style="height: 100vh;">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <a href="/" class="d-flex align-items-center text-white text-decoration-none">
            <i class="bi bi-bootstrap-fill fs-3"></i>
            <span class="fs-4 ms-2">Sidebar</span>
          </a>
          <button id="toggle-btn" class="btn btn-sm btn-outline-light ms-2">
            <i class="bi bi-list"></i>
          </button>
        </div>
        <hr>
        <ul class="nav nav-pills flex-column mb-auto">
          
          <li class="nav-item">
            <a href="{{ url_for('index') }}" class="nav-link text-white {% if request.endpoint == 'index' %}active{% endif %}">
              <i class="bi bi-house me-2"></i> <span>Home</span>
            </a>
          </li>
          
          <li>
            <a href="{{ url_for('control') }}" class="nav-link text-white {% if request.endpoint == 'control' %}active{% endif %}">
                <i class="bi bi-controller me-2"></i> <span>Control</span>
            </a>
          </li>

          <li>
            <a href="{{ url_for('view_logs') }}" class="nav-link text-white {% if request.endpoint == 'view_logs' %}active{% endif %}">
                <i class="bi bi-terminal me-2"></i> <span>Logs</span>
            </a>
          </li>
          
          <li>
            <a href="{{ url_for('ajustes') }}" class="nav-link text-white {% if request.endpoint == 'ajustes' %}active{% endif %}">
              <i class="bi bi-gear me-2"></i> <span>Ajustes</span>
            </a>
          </li>
          
          <li>
            <a href="{{ url_for('view_list') }}" class="nav-link text-white {% if request.endpoint == 'view_list' %}active{% endif %}">
              <i class="bi bi-eye me-2"></i> <span>View</span>
            </a>
          </li>
          
          <li>
            <a href="{{ url_for('camera_setup') }}" class="nav-link text-white {% if request.endpoint == 'camera_setup' %}active{% endif %}">
              <i class="bi bi-camera-video me-2"></i> <span>Camera Setup</span>
            </a>
          </li>
          
          <li>
            <a href="{{ url_for('monitor_roi') }}" class="nav-link text-white {% if request.endpoint == 'monitor_roi' %}active{% endif %}">
              <i class="bi bi-aspect-ratio me-2"></i> <span>ROI Monitor</span>
            </a>
          </li>

        </ul>
        <hr>
        <div class="dropdown mt-auto">
          <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
            <img src="https://github.com/mdo.png" alt="" width="32" height="32" class="rounded-circle me-2">
            <strong>Usuario</strong>
          </a>
          <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
            <li><a class="dropdown-item" href="#">Nuevo proyecto...</a></li>
            <li><a class="dropdown-item" href="#">Configuración</a></li>
            <li><a class="dropdown-item" href="#">Perfil</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#">Salir</a></li>
          </ul>
        </div>
      </div>

      <div class="p-4 flex-grow-1 d-flex flex-column" style="height:100vh; overflow-y: auto;">
        {% block content %}{% endblock %}
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.getElementById("toggle-btn").addEventListener("click", function() {
        document.getElementById("sidebar").classList.toggle("collapsed");
      });
    </script>
  </body>
</html>
