{% extends "base.html" %}
{% block title %}Control{% endblock %}
{% block content %}

<style>
    :root {
        --primary-blue: #2563eb;
        --primary-blue-hover: #1d4ed8;
        --secondary-slate: #475569;
        --secondary-slate-hover: #334155;
        --accent-orange: #f97316;
        --accent-orange-hover: #ea580c;
        --success-green: #10b981;
        --success-green-hover: #059669;
        --danger-red: #ef4444;
        --danger-red-hover: #dc2626;
        --bg-gray: #f8fafc;
        --border-gray: #e2e8f0;
        --text-dark: #1e293b;
        --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        --shadow-hover: 0 6px 12px rgba(0, 0, 0, 0.15);
    }

    body {
        background: var(--bg-gray);
    }

    .control-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
    }

    .page-title {
        text-align: center;
        color: var(--text-dark);
        font-size: 2rem;
        margin-bottom: 30px;
        font-weight: 600;
    }

    .video-container {
        width: 100%;
        max-width: 900px;
        height: 450px;
        border: 2px solid var(--border-gray);
        border-radius: 12px;
        margin: 0 auto 40px;
        overflow: hidden;
        box-shadow: var(--shadow);
        background: #000;
    }

    .video-container img {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    .controls-section {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
        margin-top: 40px;
    }

    .step-control {
        border: 2px solid var(--border-gray);
        padding: 20px 30px;
        border-radius: 12px;
        background: white;
        box-shadow: var(--shadow);
        text-align: center;
        min-width: 140px;
    }

    .step-control label {
        display: block;
        color: var(--secondary-slate);
        font-size: 0.85rem;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 600;
    }

    .step-control input {
        width: 80px;
        font-size: 1.5rem;
        font-weight: bold;
        color: var(--primary-blue);
        border: 2px solid var(--border-gray);
        border-radius: 8px;
        padding: 8px;
        text-align: center;
        transition: all 0.3s ease;
    }

    .step-control input:focus {
        outline: none;
        border-color: var(--primary-blue);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .step-control input::-webkit-inner-spin-button,
    .step-control input::-webkit-outer-spin-button {
        opacity: 1;
        height: 30px;
    }

    button {
        border: none;
        padding: 15px 30px;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: var(--shadow);
        outline: none;
    }

    button:hover {
        box-shadow: var(--shadow-hover);
        transform: translateY(-2px);
    }

    .btn-primary {
        background: var(--primary-blue);
        color: white;
    }

    .btn-primary:hover {
        background: var(--primary-blue-hover);
    }

    .btn-secondary {
        background: var(--secondary-slate);
        color: white;
    }

    .btn-secondary:hover {
        background: var(--secondary-slate-hover);
    }

    .btn-accent {
        background: var(--accent-orange);
        color: white;
    }

    .btn-accent:hover {
        background: var(--accent-orange-hover);
    }

    .btn-success {
        background: var(--success-green);
        color: white;
    }

    .btn-success:hover {
        background: var(--success-green-hover);
    }

    .btn-danger {
        background: var(--danger-red);
        color: white;
    }

    .btn-danger:hover {
        background: var(--danger-red-hover);
    }

    .btn-icon {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: center;
    }

    .btn-large {
        padding: 18px 36px;
        font-size: 1.1rem;
    }

    .controls-group {
        display: flex;
        flex-direction: column;
        gap: 15px;
        align-items: center;
    }

    .movement-buttons {
        display: flex;
        gap: 20px;
        align-items: center;
    }

    .loop-buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
    }

    .status-panel {
        margin-top: 40px;
        padding: 20px;
        border-radius: 12px;
        background: white;
        border: 1px solid var(--border-gray);
        box-shadow: var(--shadow);
    }

    .status-title {
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--secondary-slate);
        margin-bottom: 10px;
    }

    .status-text {
        font-size: 0.95rem;
        color: var(--text-dark);
    }

    .angle-display {
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--primary-blue);
    }

    /* Toasts */
    .toast-container {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 9999;
    }

    .toast {
        min-width: 280px;
        margin-top: 10px;
        padding: 12px 16px;
        border-radius: 8px;
        color: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: var(--shadow);
        animation: slideIn 0.3s ease-out;
        font-size: 0.95rem;
    }

    .toast-success {
        background: var(--success-green);
    }

    .toast-danger {
        background: var(--danger-red);
    }

    .toast-info {
        background: var(--primary-blue);
    }

    .toast-close {
        margin-left: 12px;
        background: transparent;
        border: none;
        color: white;
        font-size: 1.1rem;
        cursor: pointer;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateX(50px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    /* Botones de velocidad */
    .btn-velocity {
        padding: 15px 25px;
        border-radius: 12px;
        color: white;
        border: 3px solid transparent;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: var(--shadow);
        text-align: center;
    }

    .btn-velocity:hover {
        transform: translateY(-3px);
        box-shadow: var(--shadow-hover);
    }

    .btn-velocity-active {
        border-color: white;
        transform: scale(1.05);
    }

    .velocity-selector h3 {
        margin-bottom: 15px;
    }
</style>

<div class="control-container">
    <h1 class="page-title">Control de Motor y Captura</h1>

    <!-- Video principal -->
    <div class="video-container">
        <img src="{{ url_for('video_feed_roi') }}" alt="Video Stream">
    </div>

    <!-- Selector de velocidad -->
    <div class="velocity-selector" style="text-align: center; margin-bottom: 30px;">
        <h3 style="color: var(--text-dark);">⚡ Velocidad de Captura</h3>
        <div style="display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
            <button onclick="setVelocidad('lento')"
                    class="btn-velocity"
                    id="vel-lento"
                    style="background: var(--success-green);">
                🐢 Lento<br><small>(30 pasos/foto)</small>
            </button>
            <button onclick="setVelocidad('medio')"
                    class="btn-velocity btn-velocity-active"
                    id="vel-medio"
                    style="background: var(--accent-orange);">
                🚶 Medio<br><small>(60 pasos/foto)</small>
            </button>
            <button onclick="setVelocidad('rapido')"
                    class="btn-velocity"
                    id="vel-rapido"
                    style="background: var(--primary-blue);">
                🚀 Rápido<br><small>(120 pasos/foto)</small>
            </button>
        </div>
        <p id="velocidad-actual" style="margin-top: 10px; color: var(--secondary-slate);">
            Velocidad actual: <strong>Medio</strong>
        </p>
    </div>

    <!-- Controles principales -->
    <div class="controls-section">

        <!-- Paso en grados -->
        <div class="step-control">
            <label for="step-size">Paso (grados)</label>
            <input type="number" id="step-size" value="20" min="1" max="360">
            <button class="btn-secondary" style="margin-top: 10px;" onclick="setStepSize()">
                Aplicar paso
            </button>
        </div>

        <!-- Movimiento manual -->
        <div class="controls-group">
            <div class="movement-buttons">
                <button class="btn-primary btn-icon btn-large" onclick="sendAction('left')">
                    ⬅️ Izquierda
                </button>
                <button class="btn-primary btn-icon btn-large" onclick="sendAction('right')">
                    Derecha ➡️
                </button>
            </div>
            <button class="btn-success btn-icon" style="margin-top: 8px;" onclick="sendAction('capture')">
                📸 Capturar en ángulo actual
            </button>
        </div>

        <!-- Loop y STOP -->
        <div class="loop-buttons">
            <button class="btn-accent btn-icon btn-large" onclick="sendAction('start_loop_capture')">
                🔁 Loop con Captura
            </button>
            <button class="btn-secondary btn-icon" onclick="sendAction('start_loop')">
                ▶️ Loop sin Captura
            </button>
            <button class="btn-danger btn-icon btn-large" onclick="sendAction('stop')">
                🛑 STOP
            </button>
        </div>
    </div>

    <!-- Panel de estado -->
    <div class="status-panel">
        <div class="status-title">Estado del Sistema</div>
        <div class="status-text">
            Ángulo actual: <span id="current-angle" class="angle-display">— °</span><br>
            Último mensaje: <span id="last-message">Esperando acción…</span>
        </div>
    </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
let velocidadActual = 'medio';

function showToast(message, type = 'info', duration = 3000) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');

    let cls = 'toast-info';
    if (type === 'success') cls = 'toast-success';
    else if (type === 'danger') cls = 'toast-danger';

    toast.className = `toast ${cls}`;
    toast.innerHTML = `
        <span>${message}</span>
        <button class="toast-close" onclick="this.parentElement.remove()">×</button>
    `;

    container.appendChild(toast);

    setTimeout(() => {
        if (toast.parentElement) {
            toast.parentElement.removeChild(toast);
        }
    }, duration);
}

function updateStatus(angle, message) {
    const angleSpan = document.getElementById('current-angle');
    const msgSpan = document.getElementById('last-message');

    if (angle !== null && angle !== undefined && !isNaN(angle)) {
        angleSpan.textContent = angle.toFixed(2) + '°';
    }

    if (message) {
        msgSpan.textContent = message;
    }
}

function parseAngleFromResponse(text) {
    try {
        if (!text) return null;
        text = text.trim();
        if (text.startsWith('ANGULO:')) {
            const parts = text.split(':');
            if (parts.length > 1) {
                return parseFloat(parts[1].trim());
            }
        }
        return null;
    } catch (e) {
        return null;
    }
}

function sendAction(action) {
    let url = '/action/';
    let displayName = '';

    if (action === 'left') displayName = 'Movimiento Izquierda';
    else if (action === 'right') displayName = 'Movimiento Derecha';
    else if (action === 'capture') displayName = 'Captura';
    else if (action === 'start_loop') displayName = 'Loop sin captura';
    else if (action === 'start_loop_capture') displayName = 'Loop con captura';
    else if (action === 'stop') displayName = 'STOP';

    showToast(`Ejecutando: ${displayName}...`, 'info', 1500);

    fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ cmd: action })
    })
    .then(response => response.json())
    .then(data => {
        let finalMessage = '';
        let type = 'info';
        let angle = null;

        if (data.step !== undefined && data.step !== null && !isNaN(data.step)) {
            angle = parseFloat(data.step);
        }

        if (data.message) {
            finalMessage = data.message;
        } else {
            finalMessage = 'Acción ejecutada';
        }

        if (action === 'stop') {
            type = 'danger';
        } else if (action === 'capture') {
            type = data.success ? 'success' : 'danger';
        } else {
            type = data.success ? 'success' : 'danger';
        }

        const angleParsed = parseAngleFromResponse(finalMessage);
        if (angleParsed !== null) {
            angle = angleParsed;
        }

        updateStatus(angle, finalMessage);

        if (data.success) {
            if (action === 'left' || action === 'right') {
                finalMessage = `Movimiento OK. Nueva posición: ${angle !== null ? angle.toFixed(2) + '°' : 'desconocida'}`;
                type = 'success';
            }
        } else {
            finalMessage = `FALLO en ${action}: ${data.message || 'Error desconocido'}`;
            type = 'danger';
        }

        showToast(finalMessage, type);
    })
    .catch(err => {
        console.error('Error:', err);
        showToast('Error de red o conexión con el servidor', 'danger');
    });
}

function setStepSize() {
    const input = document.getElementById('step-size');
    let value = parseInt(input.value);

    if (isNaN(value) || value <= 0) {
        showToast('Valor de paso inválido', 'danger');
        return;
    }

    fetch('/set_step_size', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ step_size: value })
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            showToast(`Paso configurado a ${data.step_size}°`, 'success');
        } else {
            showToast(`Error al configurar paso: ${data.message || ''}`, 'danger');
        }
    })
    .catch(err => {
        console.error('Error:', err);
        showToast('Error al configurar paso', 'danger');
    });
}

function setVelocidad(vel) {
    fetch('/set_velocidad', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ velocidad: vel })
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            velocidadActual = vel;

            document.querySelectorAll('.btn-velocity').forEach(btn => {
                btn.classList.remove('btn-velocity-active');
            });
            const activeBtn = document.getElementById('vel-' + vel);
            if (activeBtn) activeBtn.classList.add('btn-velocity-active');

            document.getElementById('velocidad-actual').innerHTML =
                `Velocidad actual: <strong>${vel.charAt(0).toUpperCase() + vel.slice(1)}</strong>`;

            showToast(`Velocidad cambiada a: ${vel}`, 'success');
        } else {
            showToast(`Error al cambiar velocidad: ${data.message || ''}`, 'danger');
        }
    })
    .catch(err => {
        console.error('Error:', err);
        showToast('Error al cambiar velocidad', 'danger');
    });
}

document.getElementById('step-size').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        setStepSize();
    }
});
</script>

{% endblock %}
