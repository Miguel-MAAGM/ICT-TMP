{% extends "base.html" %}
{% block title %}Monitor ROI{% endblock %}
{% block content %}

<style>
    .roi-page-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        color: var(--text-dark);
        background: #1e293b; 
        min-height: 100vh;
    }

    .video-roi-box {
        border: 4px solid #f97316;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        background: #000;
        margin-bottom: 20px;
        /* Tamaño adaptable */
        max-width: 1000px;
        width: 100%;
    }

    .video-roi-box img {
        width: 100%;
        height: auto;
        display: block;
    }

    .zoom-controls {
        background: white;
        padding: 15px 30px;
        border-radius: 50px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        display: flex;
        align-items: center;
        gap: 15px;
    }
</style>

<div class="roi-page-container">
    <h2 class="mb-4 text-white">🔍 Monitor ROI (Zoom Digital)</h2>

    <div class="video-roi-box">
        <img src="{{ url_for('video_feed_roi') }}" alt="ROI Stream">
    </div>

    <div class="zoom-controls">
        <span style="font-weight: bold;">Zoom: <span id="zoom-display">1.5</span>x</span>
        <input type="range" id="zoom-slider" min="1" max="5" step="0.1" value="1.5" oninput="updateZoom(this.value)">
    </div>
</div>

<script>
    // Script simple solo para el Slider de Zoom
    function updateZoom(val) {
        document.getElementById('zoom-display').innerText = val;
        fetch('/set_roi_zoom', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ zoom: val })
        });
    }
</script>

{% endblock %}
