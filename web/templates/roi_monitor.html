{% extends "base.html" %}
{% block title %}Monitor ROI{% endblock %}
{% block content %}

<style>
    body {
        background-color: #1e293b; /* Fondo oscuro para resaltar video */
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    
    .monitor-container {
        text-align: center;
    }

    .monitor-title {
        color: white;
        margin-bottom: 20px;
        font-family: sans-serif;
    }

    .video-roi {
        border: 4px solid #f97316; /* Borde naranja para diferenciar */
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
        max-height: 80vh; /* Que no se salga de la pantalla */
        max-width: 90vw;
    }
</style>

<div class="monitor-container">
    <h2 class="monitor-title">🔍 Monitor ROI (Zoom Central)</h2>
    <img class="video-roi" src="{{ url_for('video_feed_roi') }}" alt="ROI Stream">
</div>

{% endblock %}
