{% extends "base.html" %}
{% block title %}Monitor ROI{% endblock %}
{% block content %}

<style>
    .roi-page-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        color: var(--text-dark);
        background: #1e293b; /* Fondo oscuro para esta herramienta */
        min-height: 100vh;
    }

    .video-roi-box {
        border: 4px solid #f97316;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        background: #000;
        margin-bottom: 20px;
        width: 100%;
        /* Quitamos max-width para permitir 4K full */
    }

    .video-roi-box img {
        width: 100%;
        height: auto;
        display: block;
    }

    .controls-wrapper {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
    }

    /* Estilos del Control de Zoom */
    .zoom-controls {
        background: white;
        padding: 15px 30px;
        border-radius: 50px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        display: flex;
        align-items: center;
        gap: 15px;
    }

    /* Botón 4K Estilos */
    .btn-4k {
        padding: 15px 30px;
        border-radius: 50px;
        font-weight: bold;
        border: none;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        background: #475569; /* Gris apagado por defecto */
        color: white;
    }

    .btn-4k:hover { transform: scale(1.05); }

    /* Clase cuando está activo el 4K */
    .btn-4k.active {
        background: #ef4444; /* Rojo intenso */
        box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
        70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
        100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    
    /* Overlay de carga */
    #loading-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8); color: white;
        display: none; justify-content: center; align-items: center;
        z-index: 9999; flex-direction: column;
    }
</style>

<div id="loading-overlay">
    <div class="spinner-border text-warning" role="status" style="width: 3rem; height: 3rem;"></div>
    <h3 class="mt-3">Cambiando Sensor...</h3>
</div>

<div class="roi-page-container">
    <h2 class="mb-4 text-white">🔍 Monitor ROI</h2>

    <div class="video-roi-box">
        <img id="roi-stream" src="{{ url_for('video_feed_roi') }}" alt="ROI Stream">
    </div>

    <div class="controls-wrapper">
        <div class="zoom-controls">
            <span style="font-weight: bold;">Zoom: <span id="zoom-display">1.5</span>x</span>
            <input type="range" id="zoom-slider" min="1" max="10" step="0.1" value="1.5" oninput="updateZoom(this.value)">
        </div>

        <button id="btn-4k-toggle" class="btn-4k" onclick="toggle4K()">
            SET 4K
        </button>
    </div>
</div>

<script>
    let is4KMode = false;

    function updateZoom(val) {
        document.getElementById('zoom-display').innerText = val;
        fetch('/set_roi_zoom', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ zoom: val })
        });
    }

    function toggle4K() {
        const btn = document.getElementById('btn-4k-toggle');
        const overlay = document.getElementById('loading-overlay');
        const img = document.getElementById('roi-stream');

        // Invertimos el estado deseado
        const newState = !is4KMode;
        
        // Mostrar carga
        overlay.style.display = 'flex';

        fetch('/camera/set_mode_4k', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ enable: newState })
        })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                is4KMode = newState;
                
                // Actualizar estilo del botón
                if (is4KMode) {
                    btn.classList.add('active');
                    btn.innerText = "🛑 DESACTIVAR 4K";
                } else {
                    btn.classList.remove('active');
                    btn.innerText = "🚀 SET 4K";
                }

                // Esperar un segundo y recargar la imagen para asegurar que tome el nuevo tamaño
                setTimeout(() => {
                    const timestamp = new Date().getTime();
                    img.src = "{{ url_for('video_feed_roi') }}?t=" + timestamp;
                    overlay.style.display = 'none';
                }, 1500);

            } else {
                alert("Error al cambiar modo: " + data.message);
                overlay.style.display = 'none';
            }
        })
        .catch(err => {
            console.error(err);
            overlay.style.display = 'none';
            alert("Error de conexión");
        });
    }
</script>

{% endblock %}
