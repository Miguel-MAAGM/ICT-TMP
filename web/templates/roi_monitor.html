{% extends "base.html" %}
{% block title %}Monitor ROI 4K{% endblock %}
{% block content %}

<style>
    .roi-page-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        color: var(--text-dark);
        background: #1e293b; 
        min-height: 100vh;
    }

    .video-roi-box {
        border: 4px solid #f97316;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        background: #000;
        margin-bottom: 20px;
        width: 100%;
        position: relative;
        min-height: 400px; /* Altura mínima para que se vea el cargando */
    }

    .video-roi-box img {
        width: 100%;
        height: auto;
        display: block;
        opacity: 0; /* Oculto al inicio hasta que cargue el 4K */
        transition: opacity 0.5s ease;
    }

    .zoom-controls {
        background: white;
        padding: 15px 30px;
        border-radius: 50px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        display: flex;
        align-items: center;
        gap: 15px;
    }

    /* Pantalla de carga elegante dentro del video */
    #loader-msg {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        text-align: center;
        font-family: sans-serif;
    }
    .spinner {
        border: 4px solid rgba(255,255,255,0.3);
        border-radius: 50%;
        border-top: 4px solid #f97316;
        width: 40px; height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 10px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>

<div class="roi-page-container">
    <h2 class="mb-4 text-white">🔍 Monitor ROI (Ultra HD)</h2>

    <div class="video-roi-box">
        <div id="loader-msg">
            <div class="spinner"></div>
            <h3>Iniciando Sensor 4K...</h3>
        </div>
        
        <img id="roi-stream" src="" alt="ROI Stream">
    </div>

    <div class="zoom-controls">
        <span style="font-weight: bold;">Zoom: <span id="zoom-display">1.5</span>x</span>
        <input type="range" id="zoom-slider" min="1" max="10" step="0.1" value="1.5" oninput="updateZoom(this.value)">
    </div>
</div>

<script>
    // Al cargar la página, forzamos el modo 4K automáticamente
    document.addEventListener("DOMContentLoaded", function() {
        activarModo4K();
    });

    function activarModo4K() {
        fetch('/camera/set_mode_4k', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ enable: true }) // TRUE = Activar 4K
        })
        .then(r => r.json())
        .then(data => {
            console.log("Modo 4K Activado:", data);
            
            // Esperamos un poco para que la cámara estabilice y cargamos la imagen
            setTimeout(() => {
                const img = document.getElementById('roi-stream');
                const loader = document.getElementById('loader-msg');
                
                // Forzamos recarga de imagen con timestamp
                img.src = "{{ url_for('video_feed_roi') }}?t=" + new Date().getTime();
                
                // Efecto visual: Ocultar loader, mostrar imagen
                img.onload = function() {
                    loader.style.display = 'none';
                    img.style.opacity = '1';
                };
            }, 1000);
        })
        .catch(err => console.error("Error activando 4K:", err));
    }

    function updateZoom(val) {
        document.getElementById('zoom-display').innerText = val;
        fetch('/set_roi_zoom', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ zoom: val })
        });
    }
</script>

{% endblock %}
