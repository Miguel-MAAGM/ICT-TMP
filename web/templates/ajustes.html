{% extends "base.html" %}
{% block title %}Ajustes{% endblock %}
{% block content %}

<div class="d-flex justify-content-center align-items-center vh-100">
  <div class="d-flex gap-5">
    <!-- Botón calibración de cámara -->
    <a href="{{ url_for('ajustes_camara') }}" 
       class="btn btn-primary d-flex flex-column align-items-center justify-content-center"
       style="width: 300px; height: 220px; font-size: 1.3rem;">
      <i class="bi bi-camera" style="font-size: 4rem;"></i>
      <span class="mt-3">Calibración de cámara</span>
    </a>

    <!-- Botón calibración de color (aún sin ruta definida) -->
    <a href="{{ url_for('ajustes_color_list') }}" class="btn btn-success d-flex flex-column align-items-center justify-content-center"
       style="width: 300px; height: 220px; font-size: 1.3rem;">
      <i class="bi bi-palette" style="font-size: 4rem;"></i>
      <span class="mt-3">Calibración de color</span>
    </a>
  </div>
</div>

{% endblock %}
